<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
  <title>opKapot</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name"><img class="brand-logo" src="assets/icon.png" width="26" height="26" alt="">opKapot <span class="brand-ver"></span></div>
        <div class="brand-tag">Uninstaller &amp; Security</div>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>
    <main class="main">
      <header class="titlebar">
        <div class="titlebar-actions">
          <button class="tb-btn" id="btn-refresh" title="Refresh (F5)"></button>
          <button class="tb-btn" id="btn-settings" title="Settings"></button>
          <button class="tb-btn" id="btn-menu" title="Menu"></button>
          <span class="tb-sep"></span>
          <button class="tb-btn win" id="win-min" title="Minimize"></button>
          <button class="tb-btn win" id="win-max" title="Maximize"></button>
          <button class="tb-btn win close" id="win-close" title="Close"></button>
        </div>
      </header>
      <section class="view-host" id="view-host"></section>
      <footer class="bottom-bar" id="bottom-bar"></footer>
    </main>
  </div>
  <div id="overlay-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
